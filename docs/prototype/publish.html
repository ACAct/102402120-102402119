<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>发布信息 · 校园失物招领</title>
<style>
/* ==================== 设计令牌（与首页保持一致） ==================== */
:root {
  --blue-600: #2E6BE6;
  --blue-500: #3B79F0;
  --blue-400: #5B8DEF;
  --blue-50: #EEF4FF;
  --blue-100: #E0ECFF;
  --blue-bd: #D9E7FF;

  --amber-600: #D98207;
  --amber-500: #F59E0B;
  --amber-50: #FFF6E9;
  --amber-bd: #FBE3C4;

  --green-600: #16A34A;
  --green-50: #ECFDF3;
  --green-bd: #CBEFDB;

  --red-600: #DC2626;

  --ink-900: #101828;
  --ink-700: #344054;
  --ink-600: #475467;
  --ink-500: #667085;
  --ink-400: #8A94A6;
  --ink-300: #A9B2C1;
  --ink-200: #CDD4DE;
  --line: #EEF1F6;
  --line-2: #E4E9F2;
  --bg: #F6F8FC;
  --white: #FFFFFF;

  --r-xl: 20px;
  --r-lg: 16px;
  --r-md: 14px;
  --r-sm: 10px;
  --r-pill: 999px;

  --sh-1: 0 1px 3px rgba(16,24,40,.04), 0 1px 2px rgba(16,24,40,.04);
  --sh-2: 0 4px 12px -4px rgba(16,24,40,.08), 0 2px 4px -2px rgba(16,24,40,.04);
  --sh-3: 0 8px 24px -8px rgba(46,107,230,.25), 0 4px 12px -4px rgba(16,24,40,.06);

  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
    "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  color: var(--ink-900);
  background: #E5E7EB;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 16px 48px;
}

/* ==================== 手机外框（与首页一致） ==================== */
.phone {
  position: relative;
  width: 375px;
  height: 812px;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 40px 80px -24px rgba(0,0,0,.25),
    0 16px 32px -16px rgba(0,0,0,.15),
    0 2px 6px rgba(0,0,0,.08);
  border: 1px solid rgba(0,0,0,.05);
  display: flex;
  flex-direction: column;
}

.notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 32px;
  background: #000;
  border-radius: 20px;
  z-index: 50;
}

.home-indicator {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: #000;
  border-radius: 3px;
  z-index: 50;
}

/* ==================== 状态栏 ==================== */
.status-bar {
  flex: none;
  height: 44px;
  padding: 0 20px 4px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  position: relative;
  z-index: 10;
}
.status-bar .right {
  display: flex;
  align-items: center;
  gap: 5px;
}

/* ==================== 顶部导航栏 ==================== */
.navbar {
  flex: none;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  position: relative;
}

.nav-back {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink-700);
  cursor: pointer;
  transition: .15s;
}
.nav-back:active {
  background: var(--line);
}
.nav-back svg { width: 22px; height: 22px; }

.nav-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: -0.2px;
}

/* ==================== 可滚动内容区 ==================== */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 148px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.content::-webkit-scrollbar { display: none; }

/* ==================== 类型选择卡片 ==================== */
.type-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 22px;
}

.type-card {
  position: relative;
  height: 88px;
  border-radius: var(--r-lg);
  padding: 14px;
  border: 1.5px solid var(--line-2);
  background: var(--white);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: .2s;
}
.type-card:active { transform: scale(0.98); }

.type-card .type-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--blue-50);
  color: var(--blue-600);
}
.type-card .type-icon svg { width: 22px; height: 22px; }

.type-card .type-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: -0.1px;
}
.type-card .type-sub {
  font-size: 11px;
  color: var(--ink-400);
  margin-top: 2px;
}

/* 选中态 */
.type-card.active {
  border-color: var(--blue-600);
  background: var(--blue-50);
  box-shadow: var(--sh-3);
}
.type-card.active .type-icon {
  background: var(--blue-600);
  color: #fff;
}
.type-card.active .type-label { color: var(--blue-700, #1D4ED8); }

/* ==================== 表单通用 ==================== */
.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-700);
  margin-bottom: 8px;
}
.form-label .req {
  color: var(--red-600);
  font-size: 14px;
  line-height: 1;
}
.form-label .hint {
  margin-left: auto;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-300);
}

/* 输入框 */
.form-input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  background: var(--white);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  font-family: var(--font);
  font-size: 14px;
  color: var(--ink-900);
  outline: none;
  transition: .15s;
}
.form-input::placeholder {
  color: var(--ink-300);
}
.form-input:focus {
  border-color: var(--blue-400);
  box-shadow: 0 0 0 3px rgba(46,107,230,.1);
}

/* 选择器样式（右侧有箭头） */
.form-select {
  position: relative;
}
.form-select .form-input {
  cursor: pointer;
  appearance: none;
  background-image: none;
}
.form-select .arrow {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-300);
  pointer-events: none;
}
.form-select .arrow svg { width: 16px; height: 16px; }

/* 多行文本 */
.form-textarea {
  width: 100%;
  min-height: 104px;
  padding: 12px 14px;
  background: var(--white);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  font-family: var(--font);
  font-size: 14px;
  color: var(--ink-900);
  line-height: 1.6;
  resize: vertical;
  outline: none;
  transition: .15s;
}
.form-textarea::placeholder {
  color: var(--ink-300);
}
.form-textarea:focus {
  border-color: var(--blue-400);
  box-shadow: 0 0 0 3px rgba(46,107,230,.1);
}

.counter {
  text-align: right;
  font-size: 11px;
  color: var(--ink-300);
  margin-top: 6px;
}

/* ==================== 图片上传 ==================== */
.upload-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.upload-slot {
  aspect-ratio: 1;
  border-radius: var(--r-md);
  position: relative;
  overflow: hidden;
}

.upload-slot.add {
  background: var(--white);
  border: 1.5px dashed var(--ink-300);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--ink-300);
  cursor: pointer;
  transition: .15s;
}
.upload-slot.add:active {
  border-color: var(--blue-400);
  color: var(--blue-400);
}
.upload-slot.add svg { width: 26px; height: 26px; }
.upload-slot.add span { font-size: 10px; }

.upload-slot.preview {
  background: var(--blue-50);
  border: 1px solid var(--line-2);
  display: grid;
  place-items: center;
}
.upload-slot.preview svg { width: 32px; height: 32px; color: var(--blue-400); }

.upload-slot .del-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(0,0,0,.6);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  backdrop-filter: blur(4px);
}
.upload-slot .del-btn svg { width: 12px; height: 12px; }

/* ==================== 联系方式选择 ==================== */
.contact-bar {
  display: flex;
  align-items: center;
  gap: 0;
  width: 100%;
  height: 48px;
  background: var(--white);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  overflow: hidden;
}
.contact-bar .contact-type {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  height: 100%;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-600);
  border-right: 1px solid var(--line-2);
  cursor: pointer;
  flex: none;
  background: var(--white);
}
.contact-bar .contact-type svg { width: 14px; height: 14px; }
.contact-bar .contact-type .chev { width: 12px; height: 12px; color: var(--ink-300); }
.contact-bar .contact-val {
  flex: 1;
  height: 100%;
  padding: 0 12px;
  border: none;
  font-family: var(--font);
  font-size: 13px;
  color: var(--ink-900);
  background: transparent;
  outline: none;
}
.contact-bar .contact-val::placeholder { color: var(--ink-300); }

/* ==================== 底部按钮 ==================== */
.bottom-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 16px 32px;
  background: linear-gradient(180deg, rgba(246,248,252,0) 0%, rgba(246,248,252,0.95) 30%, #F6F8FC 100%);
  z-index: 10;
}

.btn-primary {
  width: 100%;
  height: 50px;
  border: none;
  border-radius: var(--r-md);
  background: linear-gradient(135deg, var(--blue-500), #2456CF);
  color: #fff;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 10px 22px -10px rgba(46,107,230,.7);
  transition: .15s;
}
.btn-primary:active {
  transform: scale(0.99);
  box-shadow: 0 6px 14px -6px rgba(46,107,230,.6);
}

/* 安全提示 */
.safety-tip {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 12px 14px;
  margin-bottom: 6px;
  background: var(--amber-50);
  border: 1px solid var(--amber-bd);
  border-radius: var(--r-md);
  font-size: 11.5px;
  color: var(--amber-600);
  line-height: 1.6;
}
.safety-tip svg {
  width: 16px;
  height: 16px;
  flex: none;
  margin-top: 1px;
  stroke: var(--amber-600);
}

/* ==================== 图标 ==================== */
svg.ic { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

</style>
</head>
<body>

<div class="phone">
  <!-- 刘海 -->
  <div class="notch"></div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <svg class="ic" viewBox="0 0 24 24" width="17" height="17">
        <path d="M2 16h3M8 13h3M14 10h3M20 7h2" stroke-width="2.2"/>
      </svg>
      <svg class="ic" viewBox="0 0 24 24" width="16" height="16">
        <path d="M5.6 10.8a9.4 9.4 0 0 1 12.8 0M8.5 13.9a5.4 5.4 0 0 1 7 0"/>
        <circle cx="12" cy="17.2" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
      <svg viewBox="0 0 27 12" width="24" height="12" fill="none">
        <rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="currentColor" opacity=".5"/>
        <rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/>
        <rect x="2" y="2" width="18" height="8" rx="1.2" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <!-- 顶部导航栏 -->
  <div class="navbar">
    <div class="nav-back">
      <svg class="ic" viewBox="0 0 24 24">
        <path d="M14.4 5.4 7.8 12l6.6 6.6"/>
      </svg>
    </div>
    <span class="nav-title">发布信息</span>
  </div>

  <!-- 可滚动内容 -->
  <div class="content">

    <!-- 类型选择卡片 -->
    <div class="type-row">
      <div class="type-card active" data-type="lost" onclick="switchType(this)">
        <div class="type-icon">
          <svg class="ic" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="M16.2 16.2 20.8 20.8"/>
          </svg>
        </div>
        <div>
          <div class="type-label">我要寻物</div>
          <div class="type-sub">发布寻物启事</div>
        </div>
      </div>
      <div class="type-card" data-type="found" onclick="switchType(this)">
        <div class="type-icon">
          <svg class="ic" viewBox="0 0 24 24">
            <path d="M20 12V8a2 2 0 0 0-2-2h-3V4a3 3 0 1 0-6 0v2H6a2 2 0 0 0-2 2v4"/>
            <path d="M4 12h16v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
          </svg>
        </div>
        <div>
          <div class="type-label">我要招领</div>
          <div class="type-sub">发布失物招领</div>
        </div>
      </div>
    </div>

    <!-- 表单 -->
    <!-- 物品名称 -->
    <div class="form-group">
      <div class="form-label">
        物品名称 <span class="req">*</span>
        <span class="hint">不超过 30 字</span>
      </div>
      <input type="text" class="form-input" placeholder="请输入物品名称">
    </div>

    <!-- 物品图片 -->
    <div class="form-group">
      <div class="form-label">
        物品图片 <span class="req">*</span>
        <span class="hint">最多 3 张</span>
      </div>
      <div class="upload-grid">
        <div class="upload-slot add">
          <svg class="ic" viewBox="0 0 24 24">
            <path d="M12 5.2v13.6M5.2 12h13.6"/>
          </svg>
          <span>添加图片</span>
        </div>
        <div class="upload-slot preview">
          <svg class="ic" viewBox="0 0 24 24">
            <path d="M4 9a2.2 2.2 0 0 1 2.2-2.2h1.6l1.1-1.7h6.2l1.1 1.7h1.6A2.2 2.2 0 0 1 20 9v7.2a2.2 2.2 0 0 1-2.2 2.2H6.2A2.2 2.2 0 0 1 4 16.2z"/>
            <circle cx="12" cy="12.4" r="3.2"/>
          </svg>
          <div class="del-btn">
            <svg class="ic" viewBox="0 0 24 24"><path d="M6.6 6.6l10.8 10.8M17.4 6.6 6.6 17.4"/></svg>
          </div>
        </div>
        <div class="upload-slot preview">
          <svg class="ic" viewBox="0 0 24 24">
            <path d="M4 9a2.2 2.2 0 0 1 2.2-2.2h1.6l1.1-1.7h6.2l1.1 1.7h1.6A2.2 2.2 0 0 1 20 9v7.2a2.2 2.2 0 0 1-2.2 2.2H6.2A2.2 2.2 0 0 1 4 16.2z"/>
            <circle cx="12" cy="12.4" r="3.2"/>
          </svg>
          <div class="del-btn">
            <svg class="ic" viewBox="0 0 24 24"><path d="M6.6 6.6l10.8 10.8M17.4 6.6 6.6 17.4"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 时间 -->
    <div class="form-group">
      <div class="form-label">
        <span id="timeLabel">丢失时间</span> <span class="req">*</span>
      </div>
      <div class="form-select">
        <input type="text" class="form-input" id="timeInput" placeholder="请选择时间" readonly value="今天 18:20">
        <span class="arrow">
          <svg class="ic" viewBox="0 0 24 24">
            <path d="M6 9.6 12 15.6l6-6"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- 地点 -->
    <div class="form-group">
      <div class="form-label">
        <span id="locLabel">丢失地点</span> <span class="req">*</span>
      </div>
      <div class="form-select">
        <input type="text" class="form-input" id="locInput" placeholder="请输入丢失地点" value="图书馆一楼东门">
        <span class="arrow">
          <svg class="ic" viewBox="0 0 24 24">
            <path d="M12 21s6-5.5 6-10a6 6 0 0 0-12 0c0 4.5 6 10 6 10z"/>
            <circle cx="12" cy="11" r="2.5"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- 物品描述 -->
    <div class="form-group">
      <div class="form-label">
        物品描述
        <span class="hint">请描述特征、颜色、特殊标记等</span>
      </div>
      <textarea class="form-textarea" placeholder="请描述物品特征，例如颜色、品牌、特殊标记等"></textarea>
      <div class="counter"><span id="descCount">0</span> / 200</div>
    </div>

    <!-- 联系方式 -->
    <div class="form-group">
      <div class="form-label">
        联系方式 <span class="req">*</span>
      </div>
      <div class="contact-bar">
        <div class="contact-type">
          微信
          <svg class="ic chev" viewBox="0 0 24 24">
            <path d="M6 9.6 12 15.6l6-6"/>
          </svg>
        </div>
        <input type="text" class="contact-val" placeholder="请输入方便联系的方式" value="">
      </div>
    </div>

    <!-- 安全提示 -->
    <div class="safety-tip">
      <svg class="ic" viewBox="0 0 24 24">
        <path d="M12 3.6 5.4 6.4v5.1c0 4 2.8 7.4 6.6 8.9 3.8-1.5 6.6-4.9 6.6-8.9V6.4z"/>
        <path d="M12 8v5M12 16h.01"/>
      </svg>
      <span>请勿填写身份证号、银行卡号等敏感信息；仅在确认物品归属后再归还或交付，平台不参与任何金钱交易。</span>
    </div>

  </div>

  <!-- 底部固定按钮 -->
  <div class="bottom-bar">
    <button class="btn-primary">发布信息</button>
  </div>

  <!-- 底部横条 -->
  <div class="home-indicator"></div>
</div>

<script>
  // 类型切换（联动表单占位文字）
  function switchType(el) {
    document.querySelectorAll('.type-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');

    const type = el.dataset.type;
    const timeLabel = document.getElementById('timeLabel');
    const locLabel = document.getElementById('locLabel');
    const timeInput = document.getElementById('timeInput');
    const locInput = document.getElementById('locInput');

    if (type === 'lost') {
      timeLabel.textContent = '丢失时间';
      locLabel.textContent = '丢失地点';
      timeInput.placeholder = '请选择丢失时间';
      locInput.placeholder = '请输入丢失地点';
      locInput.value = '';
    } else {
      timeLabel.textContent = '拾取时间';
      locLabel.textContent = '拾取地点';
      timeInput.placeholder = '请选择拾取时间';
      locInput.placeholder = '请输入拾取地点';
      locInput.value = '';
    }
  }

  // 描述字数统计
  const ta = document.querySelector('.form-textarea');
  const counter = document.getElementById('descCount');
  if (ta) {
    ta.addEventListener('input', () => {
      counter.textContent = ta.value.length;
    });
  }
</script>

</body>
</html>
